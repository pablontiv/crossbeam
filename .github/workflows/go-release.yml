# .github/workflows/go-release.yml
name: Go Release

on:
  workflow_call:
    inputs:
      quality-gate-jobs:
        required: true
        type: string
        description: 'JSON array of job names to wait for before tagging'
      binary-name:
        required: false
        type: string
        default: ''
        description: 'Binary name for smoke test, empty skips smoke test'
      goreleaser-args:
        required: false
        type: string
        default: 'release --clean'
        description: 'Goreleaser arguments'
      signing:
        required: false
        type: boolean
        default: false
        description: 'Enable GPG signing'
      graduation-threshold:
        required: false
        type: number
        default: 5
        description: 'Minor version threshold for auto-graduation to v1.0.0. 0 disables.'
      force-bump:
        required: false
        type: string
        default: ''
        description: 'Override the computed bump: major, minor, patch, or empty for automatic'
    secrets:
      GPG_PRIVATE_KEY:
        required: false
        description: 'GPG private key for signing (required if signing enabled)'
      GPG_FINGERPRINT:
        required: false
        description: 'GPG fingerprint (required if signing enabled)'

permissions: {}

jobs:
  auto-tag:
    name: Auto-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        env:
          GRADUATION_THRESHOLD: ${{ inputs.graduation-threshold }}
          FORCE_BUMP: ${{ inputs.force-bump }}
        run: |
          case "$FORCE_BUMP" in
            ""|major|minor|patch) ;;
            *)
              echo "::error::Invalid force-bump '$FORCE_BUMP': expected empty, major, minor, or patch"
              exit 1
              ;;
          esac

          # Find latest semver tag
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            LATEST="v0.0.0"
          fi

          # Parse version components
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)

          # Classify every commit since the last tag (a push may contain several
          # commits); the highest-impact type wins: breaking > feat > fix/perf > other.
          if [[ "$LATEST" == "v0.0.0" ]]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi
          SUBJECTS=$(git log --pretty=%s "$RANGE")
          BODIES=$(git log --pretty=%b "$RANGE")
          BREAKING=false
          TYPE=other

          # Check for breaking: ! in subject OR BREAKING CHANGE trailer in body
          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODIES" | grep -qE 'BREAKING CHANGE'; then
            BREAKING=true
          fi

          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?[!]?:'; then
            TYPE=feat
          elif echo "$SUBJECTS" | grep -qE '^fix(\(.+\))?[!]?:'; then
            TYPE=fix
          elif echo "$SUBJECTS" | grep -qE '^perf(\(.+\))?[!]?:'; then
            TYPE=perf
          fi

          # A manual override is release-worthy even when the range only contains
          # maintenance commits. Without one, those ranges intentionally do not tag.
          if [[ -z "$FORCE_BUMP" && "$BREAKING" != "true" && "$TYPE" == "other" ]]; then
            echo "No release-worthy commits found (type=$TYPE, breaking=$BREAKING); skipping tag"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Apply the explicit override first, then the automatic bump table.
          if [[ "$FORCE_BUMP" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "patch" ]]; then
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ $MAJOR -eq 0 ]]; then
            if [[ $GRADUATION_THRESHOLD -gt 0 && $MINOR -ge $GRADUATION_THRESHOLD && ("$TYPE" == "feat" || "$BREAKING" == "true") ]]; then
              NEW_TAG="v1.0.0"
            elif [[ "$TYPE" == "feat" || "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          else
            if [[ "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            elif [[ "$TYPE" == "feat" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "Computed tag: $NEW_TAG (from $LATEST, type=$TYPE, breaking=$BREAKING)"

          # Concurrent guard: check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/${NEW_TAG}$"; then
            echo "Tag $NEW_TAG already exists on remote, skipping"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: auto-tag
    permissions:
      contents: write
    if: needs.auto-tag.outputs.created == 'true'
    outputs:
      release-tag: ${{ needs.auto-tag.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable

      - name: Import GPG key
        if: inputs.signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test binary
        if: inputs.binary-name != ''
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          set -euo pipefail

          ARTIFACT=$(python3 <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path("dist/artifacts.json")
          try:
              artifacts = json.loads(manifest.read_text())
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid artifact manifest: {error}") from error

          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("invalid artifact manifest: expected a list of objects")

          binary_name = os.environ["BINARY_NAME"]
          matches = [
              item
              for item in artifacts
              if item.get("type") == "Binary"
              and item.get("name") == binary_name
              and item.get("goos") == "linux"
              and item.get("goarch") == "amd64"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one linux/amd64 Binary artifact, found {len(matches)}")

          artifact_path = matches[0].get("path")
          if not isinstance(artifact_path, str) or not artifact_path:
              raise SystemExit("matched artifact has no path")

          dist = Path("dist").resolve()
          candidate = Path(artifact_path)
          if not candidate.is_absolute():
              candidate = Path.cwd() / candidate
          try:
              candidate = candidate.resolve(strict=True)
              candidate.relative_to(dist)
          except (OSError, ValueError) as error:
              raise SystemExit(f"artifact path is missing or outside dist: {artifact_path}") from error
          if not candidate.is_file():
              raise SystemExit(f"artifact path is not a file: {artifact_path}")

          print(candidate)
          PY
          )

          chmod +x "$ARTIFACT"
          if "$ARTIFACT" --version; then
            exit 0
          fi
          "$ARTIFACT" version

  attest:
    name: Attest published release assets
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download published release assets
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import tempfile
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode, urljoin, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          MAX_JSON = 1024 * 1024
          MAX_ASSETS = 32
          MAX_ASSET = 256 * 1024 * 1024
          MAX_TOTAL = 1024 * 1024 * 1024
          MAX_MANIFEST = 1024 * 1024
          MAX_REDIRECTS = 3
          PAGE_SIZE = 50
          CHUNK = 1024 * 1024
          REDIRECT_HOSTS = {
              "release-assets.githubusercontent.com",
              "objects.githubusercontent.com",
              "github-releases.githubusercontent.com",
          }
          PORTABLE = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          DEVICES = {"CON", "PRN", "AUX", "NUL", *(f"COM{n}" for n in range(1, 10)), *(f"LPT{n}" for n in range(1, 10))}

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          OPENER = build_opener(NoRedirect)

          def fail(message):
              raise SystemExit(f"::error::{message}")

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def bounded_read(response, maximum, label):
              raw_length = response.headers.get("Content-Length")
              if raw_length is not None:
                  try:
                      length = int(raw_length)
                  except ValueError as error:
                      fail(f"invalid Content-Length for {label}: {error}")
                  if length < 0 or length > maximum:
                      fail(f"{label} exceeds its byte limit")
              chunks = []
              total = 0
              while True:
                  chunk = response.read(min(64 * 1024, maximum + 1 - total))
                  if not chunk:
                      break
                  chunks.append(chunk)
                  total += len(chunk)
                  if total > maximum:
                      fail(f"{label} exceeds its byte limit")
              return b"".join(chunks)

          def open_response(request):
              try:
                  return OPENER.open(request, timeout=30)
              except HTTPError as error:
                  return error

          def api_json(url, token, label):
              request = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              response = open_response(request)
              try:
                  if response.status != 200:
                      fail(f"GitHub API returned HTTP {response.status} for {label}")
                  data = bounded_read(response, MAX_JSON, label)
              finally:
                  response.close()
              try:
                  return json.loads(
                      data.decode("utf-8"),
                      object_pairs_hook=unique_object,
                      parse_constant=reject_constant,
                  ), data
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
                  fail(f"invalid bounded JSON for {label}: {error}")

          def portable_name(value):
              if (not isinstance(value, str) or not PORTABLE.fullmatch(value)
                      or value in (".", "..") or value.endswith((".", " "))
                      or value.split(".", 1)[0].upper() in DEVICES):
                  fail("release asset name is not a portable basename")
              return value

          def enumerate_assets(api_url, repository, release_id, token):
              assets = []
              seen_ids = set()
              seen_names = set()
              seen_folded = set()
              page = 1
              while True:
                  query = urlencode({"per_page": PAGE_SIZE, "page": page})
                  endpoint = f"{api_url}/repos/{repository}/releases/{release_id}/assets?{query}"
                  values, _ = api_json(endpoint, token, f"release assets page {page}")
                  if not isinstance(values, list):
                      fail("release assets page must be a JSON list")
                  for asset in values:
                      if len(assets) >= MAX_ASSETS:
                          fail(f"release has more than {MAX_ASSETS} assets")
                      if not isinstance(asset, dict):
                          fail("release asset record must be an object")
                      asset_id = asset.get("id")
                      name = portable_name(asset.get("name"))
                      size = asset.get("size")
                      digest = asset.get("digest")
                      if (isinstance(asset_id, bool) or not isinstance(asset_id, int) or asset_id <= 0
                              or asset_id in seen_ids):
                          fail("release asset ID is invalid or duplicated")
                      if name in seen_names or name.casefold() in seen_folded:
                          fail("release asset name is duplicated or case-colliding")
                      if isinstance(size, bool) or not isinstance(size, int) or size <= 0 or size > MAX_ASSET:
                          fail("release asset size is invalid or exceeds 256 MiB")
                      if digest is not None and (not isinstance(digest, str)
                              or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest)):
                          fail("release asset API digest is malformed")
                      seen_ids.add(asset_id)
                      seen_names.add(name)
                      seen_folded.add(name.casefold())
                      assets.append({"id": asset_id, "name": name, "size": size, "digest": digest})
                  if len(values) < PAGE_SIZE:
                      break
                  page += 1
              if sum(asset["name"] == "checksums.txt" for asset in assets) != 1 or len(assets) < 2:
                  fail("release must contain exactly one checksums.txt and at least one other asset")
              if next(asset["size"] for asset in assets if asset["name"] == "checksums.txt") > MAX_MANIFEST:
                  fail("checksums.txt exceeds 1 MiB")
              if sum(asset["size"] for asset in assets) > MAX_TOTAL:
                  fail("release assets exceed the 1 GiB aggregate limit")
              return assets

          def download_asset(api_url, repository, asset, token, directory_fd):
              endpoint = f"{api_url}/repos/{repository}/releases/assets/{asset['id']}"
              url = endpoint
              redirects = 0
              authorization = token
              response = None
              while True:
                  headers = {"Accept": "application/octet-stream"}
                  if authorization is not None:
                      headers["Authorization"] = f"Bearer {authorization}"
                      headers["X-GitHub-Api-Version"] = "2022-11-28"
                  response = open_response(Request(url, headers=headers))
                  if response.status == 200:
                      break
                  if response.status not in (301, 302, 303, 307, 308):
                      response.close()
                      fail(f"asset download returned HTTP {response.status}: {asset['name']}")
                  location = response.headers.get("Location")
                  response.close()
                  redirects += 1
                  if redirects > MAX_REDIRECTS or not location:
                      fail(f"asset redirect limit or location is invalid: {asset['name']}")
                  target = urlparse(urljoin(url, location))
                  if (target.scheme != "https" or target.username is not None or target.password is not None
                          or target.hostname not in REDIRECT_HOSTS or target.port not in (None, 443)):
                      fail(f"asset redirect host is not allowed: {asset['name']}")
                  url = target.geturl()
                  authorization = None

              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0) | getattr(os, "O_CLOEXEC", 0)
              try:
                  descriptor = os.open(asset["name"], flags, 0o600, dir_fd=directory_fd)
              except OSError as error:
                  response.close()
                  fail(f"cannot exclusively create downloaded asset {asset['name']}: {error}")
              digest = hashlib.sha256()
              total = 0
              try:
                  while True:
                      chunk = response.read(CHUNK)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > asset["size"] or total > MAX_ASSET:
                          fail(f"asset transfer exceeds declared size: {asset['name']}")
                      digest.update(chunk)
                      view = memoryview(chunk)
                      while view:
                          written = os.write(descriptor, view)
                          view = view[written:]
                  metadata = os.fstat(descriptor)
                  if not stat.S_ISREG(metadata.st_mode) or total != asset["size"] or metadata.st_size != total:
                      fail(f"asset transfer is truncated or not regular: {asset['name']}")
              finally:
                  os.close(descriptor)
                  response.close()
              actual_digest = f"sha256:{digest.hexdigest()}"
              if asset["digest"] is not None and asset["digest"] != actual_digest:
                  fail(f"asset API digest mismatch: {asset['name']}")

          def main():
              token = os.environ["GH_TOKEN"]
              repository = os.environ["REPOSITORY"]
              tag = os.environ["RELEASE_TAG"]
              api_url = os.environ["API_URL"].rstrip("/")
              server_url = os.environ["SERVER_URL"].rstrip("/")
              if (not token or not tag or repository != os.environ["EVENT_REPOSITORY"]
                      or urlparse(api_url).scheme != "https"):
                  fail("release repository, API, or tag does not match the workflow event")

              release_endpoint = f"{api_url}/repos/{repository}/releases/tags/{quote(tag, safe='')}"
              release, release_bytes = api_json(release_endpoint, token, "release metadata")
              if not isinstance(release, dict):
                  fail("release metadata must be a JSON object")
              release_id = release.get("id")
              expected_release_url = f"{api_url}/repos/{repository}/releases/{release_id}"
              if (isinstance(release_id, bool) or not isinstance(release_id, int) or release_id <= 0
                      or release.get("tag_name") != tag or release.get("url") != expected_release_url
                      or release.get("assets_url") != f"{expected_release_url}/assets"
                      or release.get("html_url") != f"{server_url}/{repository}/releases/tag/{tag}"
                      or release.get("draft") is not False):
                  fail("published release identity does not match the workflow event")

              tag_endpoint = f"{api_url}/repos/{repository}/git/ref/tags/{quote(tag, safe='')}"
              tag_ref, tag_bytes = api_json(tag_endpoint, token, "release tag")
              reference = tag_ref.get("object") if isinstance(tag_ref, dict) else None
              if (not isinstance(tag_ref, dict) or tag_ref.get("ref") != f"refs/tags/{tag}"
                      or not isinstance(reference, dict) or reference.get("type") != "commit"
                      or reference.get("sha") != os.environ["EVENT_SHA"]):
                  fail("release tag does not resolve to the workflow event commit")

              assets = enumerate_assets(api_url, repository, release_id, token)
              runner_temp = os.environ["RUNNER_TEMP"]
              root = Path(tempfile.mkdtemp(prefix="go-release-attest.", dir=runner_temp))
              os.chmod(root, 0o700)
              asset_dir = root / "assets"
              asset_dir.mkdir(mode=0o700)
              (root / "release.json").write_bytes(release_bytes)
              (root / "tag.json").write_bytes(tag_bytes)
              (root / "inventory.json").write_text(json.dumps({"assets": assets}), encoding="utf-8")

              directory_flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0) | getattr(os, "O_NOFOLLOW", 0) | getattr(os, "O_CLOEXEC", 0)
              directory_fd = os.open(asset_dir, directory_flags)
              try:
                  for asset in assets:
                      download_asset(api_url, repository, asset, token, directory_fd)
              finally:
                  os.close(directory_fd)

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"asset-dir={asset_dir}\n")

          if __name__ == "__main__":
              main()
          PY

      - name: Validate published release assets
        id: validate
        env:
          ASSET_DIR: ${{ steps.download.outputs.asset-dir }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat

          asset_dir = Path(os.environ["ASSET_DIR"])
          root = asset_dir.parent
          nofollow = getattr(os, "O_NOFOLLOW", 0)
          cloexec = getattr(os, "O_CLOEXEC", 0)
          directory_flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0) | nofollow | cloexec
          file_flags = os.O_RDONLY | nofollow | cloexec
          control_limit = 1024 * 1024
          max_assets = 32
          max_asset = 256 * 1024 * 1024
          max_total = 1024 * 1024 * 1024

          def identity(metadata):
              return (
                  metadata.st_dev, metadata.st_ino, metadata.st_mode, metadata.st_size,
                  metadata.st_mtime_ns, metadata.st_ctime_ns,
              )

          def open_directory(path):
              try:
                  descriptor = os.open(path, directory_flags)
              except OSError as error:
                  raise SystemExit(f"::error::cannot open private asset directory: {error}") from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISDIR(metadata.st_mode) or metadata.st_mode & 0o077:
                  os.close(descriptor)
                  raise SystemExit("::error::asset directory is not a private real directory")
              return descriptor, metadata

          def open_child(directory_fd, name):
              try:
                  descriptor = os.open(name, file_flags, dir_fd=directory_fd)
              except OSError as error:
                  raise SystemExit(f"::error::cannot safely open release asset {name}: {error}") from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISREG(metadata.st_mode):
                  os.close(descriptor)
                  raise SystemExit(f"::error::release asset is not a regular file: {name}")
              return descriptor, metadata

          def unchanged(descriptor, before, name):
              if identity(before) != identity(os.fstat(descriptor)):
                  raise SystemExit(f"::error::release asset changed while reading: {name}")

          def read_fd(descriptor, before, name, maximum):
              if before.st_size > maximum:
                  raise SystemExit(f"::error::release control file is too large: {name}")
              chunks = []
              remaining = maximum + 1
              while remaining:
                  chunk = os.read(descriptor, min(64 * 1024, remaining))
                  if not chunk:
                      break
                  chunks.append(chunk)
                  remaining -= len(chunk)
              data = b"".join(chunks)
              unchanged(descriptor, before, name)
              if len(data) > maximum:
                  raise SystemExit(f"::error::release control file is too large: {name}")
              return data

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          metadata_path = root / "inventory.json"
          if metadata_path.stat().st_size > control_limit:
              raise SystemExit("::error::release inventory metadata is too large")
          try:
              release = json.loads(
                  metadata_path.read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit(f"::error::invalid release metadata: {error}") from error
          assets = release.get("assets") if isinstance(release, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("::error::release metadata assets must be a list")

          pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          devices = {"CON", "PRN", "AUX", "NUL", *(f"COM{n}" for n in range(1, 10)), *(f"LPT{n}" for n in range(1, 10))}
          expected = {}
          folded = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("::error::release asset metadata is malformed")
              name, size, api_digest = asset.get("name"), asset.get("size"), asset.get("digest")
              digest_valid = api_digest is None or (
                  isinstance(api_digest, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", api_digest)
              )
              if (not isinstance(name, str) or not pattern.fullmatch(name)
                      or name in (".", "..") or name.endswith((".", " "))
                      or name.split(".", 1)[0].upper() in devices
                      or isinstance(size, bool) or not isinstance(size, int) or size <= 0 or size > max_asset
                      or not digest_valid):
                  raise SystemExit("::error::release asset metadata is malformed, oversized, or non-portable")
              if name in expected or name.casefold() in folded:
                  raise SystemExit("::error::release asset metadata duplicates or collides")
              expected[name] = {"size": size, "digest": api_digest}
              folded.add(name.casefold())
          if len(expected) > max_assets:
              raise SystemExit("::error::release inventory exceeds 32 assets")
          if list(expected).count("checksums.txt") != 1 or len(expected) < 2:
              raise SystemExit("::error::release inventory must contain checksums.txt and other assets")
          if expected["checksums.txt"]["size"] > control_limit:
              raise SystemExit("::error::checksums.txt exceeds 1 MiB")
          if sum(item["size"] for item in expected.values()) > max_total:
              raise SystemExit("::error::release inventory exceeds 1 GiB")

          directory_fd, directory_before = open_directory(asset_dir)
          try:
              actual = os.listdir(directory_fd)
              if set(actual) != set(expected) or len(actual) != len(expected):
                  raise SystemExit("::error::downloaded inventory does not exactly match the release")

              checksum_fd, checksum_before = open_child(directory_fd, "checksums.txt")
              try:
                  checksum_bytes = read_fd(checksum_fd, checksum_before, "checksums.txt", control_limit)
              finally:
                  os.close(checksum_fd)
              if checksum_before.st_size != expected["checksums.txt"]["size"]:
                  raise SystemExit("::error::downloaded checksums.txt size differs from release metadata")
              try:
                  checksum_text = checksum_bytes.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("::error::checksums.txt is not UTF-8") from error
              if not checksum_text.endswith("\n") or "\r" in checksum_text:
                  raise SystemExit("::error::checksums.txt must contain LF-terminated lines")

              declared = {}
              declared_folded = set()
              for line in checksum_text[:-1].split("\n"):
                  match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
                  if not match:
                      raise SystemExit("::error::invalid checksum line")
                  digest, name = match.groups()
                  if (name in (".", "..") or name.endswith((".", " "))
                          or name.split(".", 1)[0].upper() in devices
                          or name in declared or name.casefold() in declared_folded):
                      raise SystemExit("::error::invalid, duplicate, or colliding checksum name")
                  declared[name] = digest
                  declared_folded.add(name.casefold())

              expected_assets = set(expected) - {"checksums.txt"}
              if set(declared) != expected_assets or len(declared) != len(expected_assets):
                  raise SystemExit("::error::checksums do not exactly match published release assets")

              for name in sorted(expected_assets):
                  descriptor, before = open_child(directory_fd, name)
                  digest = hashlib.sha256()
                  try:
                      while chunk := os.read(descriptor, 1024 * 1024):
                          digest.update(chunk)
                      unchanged(descriptor, before, name)
                  finally:
                      os.close(descriptor)
                  if before.st_size != expected[name]["size"]:
                      raise SystemExit(f"::error::downloaded size differs from release metadata: {name}")
                  actual_digest = digest.hexdigest()
                  if actual_digest != declared[name]:
                      raise SystemExit(f"::error::checksum mismatch for {name}")
                  if expected[name]["digest"] is not None and expected[name]["digest"] != f"sha256:{actual_digest}":
                      raise SystemExit(f"::error::GitHub API digest mismatch for {name}")
                  print(f"{name}: OK")

              if identity(directory_before) != identity(os.fstat(directory_fd)):
                  raise SystemExit("::error::asset directory changed during validation")
          finally:
              os.close(directory_fd)

          subject_digest = hashlib.sha256(checksum_bytes).hexdigest()
          manifest_api_digest = expected["checksums.txt"]["digest"]
          if manifest_api_digest is not None and manifest_api_digest != f"sha256:{subject_digest}":
              raise SystemExit("::error::GitHub API digest mismatch for checksums.txt")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checksums-digest={subject_digest}\n")
          PY

      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: checksums.txt
          subject-digest: sha256:${{ steps.validate.outputs.checksums-digest }}
