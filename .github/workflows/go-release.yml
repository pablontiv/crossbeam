# .github/workflows/go-release.yml
name: Go Release

on:
  workflow_call:
    inputs:
      quality-gate-jobs:
        required: true
        type: string
        description: 'JSON array of job names to wait for before tagging'
      binary-name:
        required: false
        type: string
        default: ''
        description: 'Binary name for smoke test, empty skips smoke test'
      goreleaser-args:
        required: false
        type: string
        default: 'release --clean'
        description: 'Goreleaser arguments'
      signing:
        required: false
        type: boolean
        default: false
        description: 'Enable GPG signing'
      graduation-threshold:
        required: false
        type: number
        default: 5
        description: 'Minor version threshold for auto-graduation to v1.0.0. 0 disables.'
      force-bump:
        required: false
        type: string
        default: ''
        description: 'Override the computed bump: major, minor, patch, or empty for automatic'
    secrets:
      GPG_PRIVATE_KEY:
        required: false
        description: 'GPG private key for signing (required if signing enabled)'
      GPG_FINGERPRINT:
        required: false
        description: 'GPG fingerprint (required if signing enabled)'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  auto-tag:
    name: Auto-tag
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        env:
          GRADUATION_THRESHOLD: ${{ inputs.graduation-threshold }}
          FORCE_BUMP: ${{ inputs.force-bump }}
        run: |
          case "$FORCE_BUMP" in
            ""|major|minor|patch) ;;
            *)
              echo "::error::Invalid force-bump '$FORCE_BUMP': expected empty, major, minor, or patch"
              exit 1
              ;;
          esac

          # Find latest semver tag
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            LATEST="v0.0.0"
          fi

          # Parse version components
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)

          # Classify every commit since the last tag (a push may contain several
          # commits); the highest-impact type wins: breaking > feat > fix/perf > other.
          if [[ "$LATEST" == "v0.0.0" ]]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi
          SUBJECTS=$(git log --pretty=%s "$RANGE")
          BODIES=$(git log --pretty=%b "$RANGE")
          BREAKING=false
          TYPE=other

          # Check for breaking: ! in subject OR BREAKING CHANGE trailer in body
          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODIES" | grep -qE 'BREAKING CHANGE'; then
            BREAKING=true
          fi

          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?[!]?:'; then
            TYPE=feat
          elif echo "$SUBJECTS" | grep -qE '^fix(\(.+\))?[!]?:'; then
            TYPE=fix
          elif echo "$SUBJECTS" | grep -qE '^perf(\(.+\))?[!]?:'; then
            TYPE=perf
          fi

          # A manual override is release-worthy even when the range only contains
          # maintenance commits. Without one, those ranges intentionally do not tag.
          if [[ -z "$FORCE_BUMP" && "$BREAKING" != "true" && "$TYPE" == "other" ]]; then
            echo "No release-worthy commits found (type=$TYPE, breaking=$BREAKING); skipping tag"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Apply the explicit override first, then the automatic bump table.
          if [[ "$FORCE_BUMP" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "patch" ]]; then
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ $MAJOR -eq 0 ]]; then
            if [[ $GRADUATION_THRESHOLD -gt 0 && $MINOR -ge $GRADUATION_THRESHOLD && ("$TYPE" == "feat" || "$BREAKING" == "true") ]]; then
              NEW_TAG="v1.0.0"
            elif [[ "$TYPE" == "feat" || "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          else
            if [[ "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            elif [[ "$TYPE" == "feat" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "Computed tag: $NEW_TAG (from $LATEST, type=$TYPE, breaking=$BREAKING)"

          # Concurrent guard: check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/${NEW_TAG}$"; then
            echo "Tag $NEW_TAG already exists on remote, skipping"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    outputs:
      release-tag: ${{ needs.auto-tag.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable

      - name: Import GPG key
        if: inputs.signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test binary
        if: inputs.binary-name != ''
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          set -euo pipefail

          ARTIFACT=$(python3 <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path("dist/artifacts.json")
          try:
              artifacts = json.loads(manifest.read_text())
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid artifact manifest: {error}") from error

          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("invalid artifact manifest: expected a list of objects")

          binary_name = os.environ["BINARY_NAME"]
          matches = [
              item
              for item in artifacts
              if item.get("type") == "Binary"
              and item.get("name") == binary_name
              and item.get("goos") == "linux"
              and item.get("goarch") == "amd64"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one linux/amd64 Binary artifact, found {len(matches)}")

          artifact_path = matches[0].get("path")
          if not isinstance(artifact_path, str) or not artifact_path:
              raise SystemExit("matched artifact has no path")

          dist = Path("dist").resolve()
          candidate = Path(artifact_path)
          if not candidate.is_absolute():
              candidate = Path.cwd() / candidate
          try:
              candidate = candidate.resolve(strict=True)
              candidate.relative_to(dist)
          except (OSError, ValueError) as error:
              raise SystemExit(f"artifact path is missing or outside dist: {artifact_path}") from error
          if not candidate.is_file():
              raise SystemExit(f"artifact path is not a file: {artifact_path}")

          print(candidate)
          PY
          )

          chmod +x "$ARTIFACT"
          if "$ARTIFACT" --version; then
            exit 0
          fi
          "$ARTIFACT" version

  attest:
    name: Attest published release assets
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download published release assets
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          umask 077

          ROOT=$(mktemp -d "${RUNNER_TEMP}/go-release-attest.XXXXXX")
          ASSET_DIR="$ROOT/assets"
          mkdir "$ASSET_DIR"

          gh api "/repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$ROOT/release.json"
          gh api "/repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > "$ROOT/tag.json"

          python3 - "$ROOT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def load(name):
              path = root / name
              if path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit(f"::error::GitHub API response is too large: {name}")
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8"),
                      object_pairs_hook=unique_object,
                      parse_constant=reject_constant,
                  )
              except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
                  raise SystemExit(f"::error::invalid GitHub API response {name}: {error}") from error

          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          api_url = os.environ["API_URL"].rstrip("/")
          server_url = os.environ["SERVER_URL"].rstrip("/")
          if not tag or repository != os.environ["EVENT_REPOSITORY"]:
              raise SystemExit("::error::release repository or tag does not match the workflow event")

          release = load("release.json")
          tag_ref = load("tag.json")
          if not isinstance(release, dict) or not isinstance(tag_ref, dict):
              raise SystemExit("::error::GitHub release or tag response has an invalid shape")
          release_id = release.get("id")
          expected_release_url = f"{api_url}/repos/{repository}/releases/{release_id}"
          expected_assets_url = f"{expected_release_url}/assets"
          expected_html_url = f"{server_url}/{repository}/releases/tag/{tag}"
          if (isinstance(release_id, bool) or not isinstance(release_id, int)
                  or release.get("tag_name") != tag or release.get("url") != expected_release_url
                  or release.get("assets_url") != expected_assets_url
                  or release.get("html_url") != expected_html_url or release.get("draft") is not False):
              raise SystemExit("::error::published release identity does not match the workflow event")
          reference = tag_ref.get("object")
          if (tag_ref.get("ref") != f"refs/tags/{tag}" or not isinstance(reference, dict)
                  or reference.get("type") != "commit" or reference.get("sha") != os.environ["EVENT_SHA"]):
              raise SystemExit("::error::release tag does not resolve to the workflow event commit")

          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("::error::release assets must be a list")
          pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          devices = {"CON", "PRN", "AUX", "NUL", *(f"COM{n}" for n in range(1, 10)), *(f"LPT{n}" for n in range(1, 10))}
          names = []
          downloads = []
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("::error::release asset record must be an object")
              asset_id, name, size = asset.get("id"), asset.get("name"), asset.get("size")
              expected_url = f"{api_url}/repos/{repository}/releases/assets/{asset_id}"
              if (isinstance(asset_id, bool) or not isinstance(asset_id, int) or asset_id <= 0
                      or not isinstance(name, str) or not pattern.fullmatch(name)
                      or name in (".", "..") or name.endswith((".", " "))
                      or name.split(".", 1)[0].upper() in devices
                      or isinstance(size, bool) or not isinstance(size, int) or size < 0
                      or asset.get("url") != expected_url):
                  raise SystemExit("::error::release asset metadata is malformed or non-portable")
              names.append(name)
              downloads.append((asset_id, name))
          if names.count("checksums.txt") != 1 or len(names) < 2:
              raise SystemExit("::error::release must contain one checksums.txt and at least one other asset")
          if len(set(names)) != len(names) or len({name.casefold() for name in names}) != len(names):
              raise SystemExit("::error::release asset names duplicate or collide")

          with (root / "downloads.tsv").open("w", encoding="utf-8", newline="\n") as output:
              for asset_id, name in downloads:
                  output.write(f"{asset_id}\t{name}\n")
          PY

          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H 'Accept: application/octet-stream' \
              "/repos/${REPOSITORY}/releases/assets/${asset_id}" > "$ASSET_DIR/$asset_name"
          done < "$ROOT/downloads.tsv"

          echo "asset-dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate published release assets
        id: validate
        env:
          ASSET_DIR: ${{ steps.download.outputs.asset-dir }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat

          asset_dir = Path(os.environ["ASSET_DIR"])
          root = asset_dir.parent
          nofollow = getattr(os, "O_NOFOLLOW", 0)
          cloexec = getattr(os, "O_CLOEXEC", 0)
          directory_flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0) | nofollow | cloexec
          file_flags = os.O_RDONLY | nofollow | cloexec
          control_limit = 4 * 1024 * 1024

          def identity(metadata):
              return (
                  metadata.st_dev, metadata.st_ino, metadata.st_mode, metadata.st_size,
                  metadata.st_mtime_ns, metadata.st_ctime_ns,
              )

          def open_directory(path):
              try:
                  descriptor = os.open(path, directory_flags)
              except OSError as error:
                  raise SystemExit(f"::error::cannot open private asset directory: {error}") from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISDIR(metadata.st_mode) or metadata.st_mode & 0o077:
                  os.close(descriptor)
                  raise SystemExit("::error::asset directory is not a private real directory")
              return descriptor, metadata

          def open_child(directory_fd, name):
              try:
                  descriptor = os.open(name, file_flags, dir_fd=directory_fd)
              except OSError as error:
                  raise SystemExit(f"::error::cannot safely open release asset {name}: {error}") from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISREG(metadata.st_mode):
                  os.close(descriptor)
                  raise SystemExit(f"::error::release asset is not a regular file: {name}")
              return descriptor, metadata

          def unchanged(descriptor, before, name):
              if identity(before) != identity(os.fstat(descriptor)):
                  raise SystemExit(f"::error::release asset changed while reading: {name}")

          def read_fd(descriptor, before, name, maximum):
              if before.st_size > maximum:
                  raise SystemExit(f"::error::release control file is too large: {name}")
              chunks = []
              remaining = maximum + 1
              while remaining:
                  chunk = os.read(descriptor, min(64 * 1024, remaining))
                  if not chunk:
                      break
                  chunks.append(chunk)
                  remaining -= len(chunk)
              data = b"".join(chunks)
              unchanged(descriptor, before, name)
              if len(data) > maximum:
                  raise SystemExit(f"::error::release control file is too large: {name}")
              return data

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          metadata_path = root / "release.json"
          if metadata_path.stat().st_size > control_limit:
              raise SystemExit("::error::release metadata is too large")
          try:
              release = json.loads(
                  metadata_path.read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit(f"::error::invalid release metadata: {error}") from error
          assets = release.get("assets") if isinstance(release, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("::error::release metadata assets must be a list")

          pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          devices = {"CON", "PRN", "AUX", "NUL", *(f"COM{n}" for n in range(1, 10)), *(f"LPT{n}" for n in range(1, 10))}
          expected = {}
          folded = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("::error::release asset metadata is malformed")
              name, size = asset.get("name"), asset.get("size")
              if (not isinstance(name, str) or not pattern.fullmatch(name)
                      or name in (".", "..") or name.endswith((".", " "))
                      or name.split(".", 1)[0].upper() in devices
                      or isinstance(size, bool) or not isinstance(size, int) or size < 0):
                  raise SystemExit("::error::release asset metadata is malformed or non-portable")
              if name in expected or name.casefold() in folded:
                  raise SystemExit("::error::release asset metadata duplicates or collides")
              expected[name] = size
              folded.add(name.casefold())
          if list(expected).count("checksums.txt") != 1 or len(expected) < 2:
              raise SystemExit("::error::release inventory must contain checksums.txt and other assets")

          directory_fd, directory_before = open_directory(asset_dir)
          try:
              actual = os.listdir(directory_fd)
              if set(actual) != set(expected) or len(actual) != len(expected):
                  raise SystemExit("::error::downloaded inventory does not exactly match the release")

              checksum_fd, checksum_before = open_child(directory_fd, "checksums.txt")
              try:
                  checksum_bytes = read_fd(checksum_fd, checksum_before, "checksums.txt", control_limit)
              finally:
                  os.close(checksum_fd)
              if checksum_before.st_size != expected["checksums.txt"]:
                  raise SystemExit("::error::downloaded checksums.txt size differs from release metadata")
              try:
                  checksum_text = checksum_bytes.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("::error::checksums.txt is not UTF-8") from error
              if not checksum_text.endswith("\n") or "\r" in checksum_text:
                  raise SystemExit("::error::checksums.txt must contain LF-terminated lines")

              declared = {}
              declared_folded = set()
              for line in checksum_text[:-1].split("\n"):
                  match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
                  if not match:
                      raise SystemExit("::error::invalid checksum line")
                  digest, name = match.groups()
                  if (name in (".", "..") or name.endswith((".", " "))
                          or name.split(".", 1)[0].upper() in devices
                          or name in declared or name.casefold() in declared_folded):
                      raise SystemExit("::error::invalid, duplicate, or colliding checksum name")
                  declared[name] = digest
                  declared_folded.add(name.casefold())

              expected_assets = set(expected) - {"checksums.txt"}
              if set(declared) != expected_assets or len(declared) != len(expected_assets):
                  raise SystemExit("::error::checksums do not exactly match published release assets")

              for name in sorted(expected_assets):
                  descriptor, before = open_child(directory_fd, name)
                  digest = hashlib.sha256()
                  try:
                      while chunk := os.read(descriptor, 1024 * 1024):
                          digest.update(chunk)
                      unchanged(descriptor, before, name)
                  finally:
                      os.close(descriptor)
                  if before.st_size != expected[name]:
                      raise SystemExit(f"::error::downloaded size differs from release metadata: {name}")
                  if digest.hexdigest() != declared[name]:
                      raise SystemExit(f"::error::checksum mismatch for {name}")
                  print(f"{name}: OK")

              if identity(directory_before) != identity(os.fstat(directory_fd)):
                  raise SystemExit("::error::asset directory changed during validation")
          finally:
              os.close(directory_fd)

          subject_digest = hashlib.sha256(checksum_bytes).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checksums-digest={subject_digest}\n")
          PY

      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: checksums.txt
          subject-digest: sha256:${{ steps.validate.outputs.checksums-digest }}
