# .github/workflows/go-release.yml
name: Go Release

on:
  workflow_call:
    inputs:
      quality-gate-jobs:
        required: true
        type: string
        description: 'JSON array of job names to wait for before tagging'
      binary-name:
        required: false
        type: string
        default: ''
        description: 'Binary name for smoke test, empty skips smoke test'
      goreleaser-args:
        required: false
        type: string
        default: 'release --clean'
        description: 'Goreleaser arguments'
      signing:
        required: false
        type: boolean
        default: false
        description: 'Enable GPG signing'
      graduation-threshold:
        required: false
        type: number
        default: 5
        description: 'Minor version threshold for auto-graduation to v1.0.0. 0 disables.'
      force-bump:
        required: false
        type: string
        default: ''
        description: 'Override the computed bump: major, minor, patch, or empty for automatic'
    secrets:
      GPG_PRIVATE_KEY:
        required: false
        description: 'GPG private key for signing (required if signing enabled)'
      GPG_FINGERPRINT:
        required: false
        description: 'GPG fingerprint (required if signing enabled)'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  auto-tag:
    name: Auto-tag
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        env:
          GRADUATION_THRESHOLD: ${{ inputs.graduation-threshold }}
          FORCE_BUMP: ${{ inputs.force-bump }}
        run: |
          case "$FORCE_BUMP" in
            ""|major|minor|patch) ;;
            *)
              echo "::error::Invalid force-bump '$FORCE_BUMP': expected empty, major, minor, or patch"
              exit 1
              ;;
          esac

          # Find latest semver tag
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            LATEST="v0.0.0"
          fi

          # Parse version components
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)

          # Classify every commit since the last tag (a push may contain several
          # commits); the highest-impact type wins: breaking > feat > fix/perf > other.
          if [[ "$LATEST" == "v0.0.0" ]]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi
          SUBJECTS=$(git log --pretty=%s "$RANGE")
          BODIES=$(git log --pretty=%b "$RANGE")
          BREAKING=false
          TYPE=other

          # Check for breaking: ! in subject OR BREAKING CHANGE trailer in body
          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODIES" | grep -qE 'BREAKING CHANGE'; then
            BREAKING=true
          fi

          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?[!]?:'; then
            TYPE=feat
          elif echo "$SUBJECTS" | grep -qE '^fix(\(.+\))?[!]?:'; then
            TYPE=fix
          elif echo "$SUBJECTS" | grep -qE '^perf(\(.+\))?[!]?:'; then
            TYPE=perf
          fi

          # A manual override is release-worthy even when the range only contains
          # maintenance commits. Without one, those ranges intentionally do not tag.
          if [[ -z "$FORCE_BUMP" && "$BREAKING" != "true" && "$TYPE" == "other" ]]; then
            echo "No release-worthy commits found (type=$TYPE, breaking=$BREAKING); skipping tag"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Apply the explicit override first, then the automatic bump table.
          if [[ "$FORCE_BUMP" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ "$FORCE_BUMP" == "patch" ]]; then
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [[ $MAJOR -eq 0 ]]; then
            if [[ $GRADUATION_THRESHOLD -gt 0 && $MINOR -ge $GRADUATION_THRESHOLD && ("$TYPE" == "feat" || "$BREAKING" == "true") ]]; then
              NEW_TAG="v1.0.0"
            elif [[ "$TYPE" == "feat" || "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          else
            if [[ "$BREAKING" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            elif [[ "$TYPE" == "feat" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "Computed tag: $NEW_TAG (from $LATEST, type=$TYPE, breaking=$BREAKING)"

          # Concurrent guard: check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/${NEW_TAG}$"; then
            echo "Tag $NEW_TAG already exists on remote, skipping"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable

      - name: Import GPG key
        if: inputs.signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test binary
        if: inputs.binary-name != ''
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          set -euo pipefail

          ARTIFACT=$(python3 <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path("dist/artifacts.json")
          try:
              artifacts = json.loads(manifest.read_text())
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid artifact manifest: {error}") from error

          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("invalid artifact manifest: expected a list of objects")

          binary_name = os.environ["BINARY_NAME"]
          matches = [
              item
              for item in artifacts
              if item.get("type") == "Binary"
              and item.get("name") == binary_name
              and item.get("goos") == "linux"
              and item.get("goarch") == "amd64"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one linux/amd64 Binary artifact, found {len(matches)}")

          artifact_path = matches[0].get("path")
          if not isinstance(artifact_path, str) or not artifact_path:
              raise SystemExit("matched artifact has no path")

          dist = Path("dist").resolve()
          candidate = Path(artifact_path)
          if not candidate.is_absolute():
              candidate = Path.cwd() / candidate
          try:
              candidate = candidate.resolve(strict=True)
              candidate.relative_to(dist)
          except (OSError, ValueError) as error:
              raise SystemExit(f"artifact path is missing or outside dist: {artifact_path}") from error
          if not candidate.is_file():
              raise SystemExit(f"artifact path is not a file: {artifact_path}")

          print(candidate)
          PY
          )

          chmod +x "$ARTIFACT"
          if "$ARTIFACT" --version; then
            exit 0
          fi
          "$ARTIFACT" version

      - name: Verify release checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat

          dist = Path("dist")
          if dist.is_symlink() or not dist.is_dir():
              raise SystemExit("::error::dist must be a real directory")

          control_limit = 4 * 1024 * 1024
          basename_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          windows_devices = {
              "CON", "PRN", "AUX", "NUL",
              *(f"COM{number}" for number in range(1, 10)),
              *(f"LPT{number}" for number in range(1, 10)),
          }

          def regular(path):
              try:
                  metadata = path.lstat()
              except OSError as error:
                  raise SystemExit(f"::error::missing release file {path}: {error}") from error
              if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"::error::release file is not regular: {path}")
              return path

          def read_control(path):
              path = regular(path)
              try:
                  with path.open("rb") as stream:
                      data = stream.read(control_limit + 1)
              except OSError as error:
                  raise SystemExit(f"::error::cannot read release file {path}: {error}") from error
              if len(data) > control_limit:
                  raise SystemExit(f"::error::release control file is too large: {path}")
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit(f"::error::release control file is not UTF-8: {path}") from error

          def portable_basename(value):
              if (not isinstance(value, str) or not basename_pattern.fullmatch(value)
                      or value in (".", "..") or value.endswith((".", " "))
                      or value.split(".", 1)[0].upper() in windows_devices):
                  raise SystemExit(f"::error::non-portable release basename: {value!r}")
              return value

          try:
              artifacts = json.loads(read_control(dist / "artifacts.json"))
          except json.JSONDecodeError as error:
              raise SystemExit(f"::error::invalid artifacts.json: {error}") from error
          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("::error::artifacts.json must use GoReleaser's direct-list shape")

          archives = [item for item in artifacts if item.get("type") == "Archive"]
          checksum_items = [item for item in artifacts if item.get("type") == "Checksum"]
          if not archives or len(checksum_items) != 1 or checksum_items[0].get("path") != "dist/checksums.txt":
              raise SystemExit("::error::expected archives and exactly one dist/checksums.txt artifact")

          expected_names = []
          for item in archives:
              raw_path = item.get("path")
              if not isinstance(raw_path, str) or not raw_path.startswith("dist/"):
                  raise SystemExit("::error::archive path must be literal dist/basename")
              name = portable_basename(raw_path.removeprefix("dist/"))
              if raw_path != f"dist/{name}":
                  raise SystemExit("::error::archive path must be literal dist/basename")
              regular(dist / name)
              expected_names.append(name)

          expected_casefold = [name.casefold() for name in expected_names]
          if len(set(expected_names)) != len(expected_names) or len(set(expected_casefold)) != len(expected_casefold):
              raise SystemExit("::error::duplicate or case-colliding archive paths in artifacts.json")

          checksum_path = regular(dist / "checksums.txt")
          checksum_text = read_control(checksum_path)
          if not checksum_text.endswith("\n") or "\r" in checksum_text:
              raise SystemExit("::error::checksums.txt must contain LF-terminated lines")
          checksum_lines = checksum_text[:-1].split("\n")
          declared = {}
          declared_casefold = set()
          for line in checksum_lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
              if not match:
                  raise SystemExit("::error::invalid checksum line")
              digest, name = match.groups()
              portable_basename(name)
              folded = name.casefold()
              if name in declared or folded in declared_casefold:
                  raise SystemExit("::error::duplicate or case-colliding checksum basename")
              declared[name] = digest
              declared_casefold.add(folded)

          if set(declared) != set(expected_names) or len(declared) != len(expected_names):
              raise SystemExit("::error::checksum names do not exactly match published archives")

          for name in expected_names:
              digest = hashlib.sha256()
              try:
                  with regular(dist / name).open("rb") as stream:
                      while chunk := stream.read(1024 * 1024):
                          digest.update(chunk)
              except OSError as error:
                  raise SystemExit(f"::error::cannot hash release asset {name}: {error}") from error
              if digest.hexdigest() != declared[name]:
                  raise SystemExit(f"::error::checksum mismatch for {name}")
              print(f"{name}: OK")
          PY

      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'dist/checksums.txt'
