name: Go CI

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: 'light'
        description: "'light' runs build+test+coverage gate; 'full' additionally runs tidy, lint, and vulnerability check, and enables -race"
      go-version:
        required: false
        type: string
        default: 'stable'
        description: 'Go version for setup-go'
      go-version-file:
        required: false
        type: string
        default: ''
        description: 'Path to go.mod for version resolution'
      coverage-threshold:
        required: false
        type: number
        default: 0
        description: 'Minimum coverage %, 0 disables check'
      lint-version:
        required: false
        type: string
        default: 'v2.10.1'
        description: 'golangci-lint version'

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file || '' }}

      - name: Cache Go build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          if [ "${{ inputs.profile }}" = "full" ]; then
            go test ./... -race -coverprofile=coverage.out
          else
            go test ./... -coverprofile=coverage.out
          fi

      - name: Check coverage threshold
        if: inputs.coverage-threshold > 0
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ inputs.coverage-threshold }}" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${{ inputs.coverage-threshold }}%"
            exit 1
          fi

  tidy:
    name: Tidy
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file || '' }}

      - name: Tidy
        run: go mod tidy

      - name: Check for changes
        run: git diff --exit-code go.mod go.sum

  lint:
    name: Lint
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file || '' }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ inputs.lint-version }}

  vuln:
    name: Vulnerability check
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file || '' }}

      - name: Cache Go build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
