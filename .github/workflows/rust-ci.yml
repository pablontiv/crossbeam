name: Rust CI

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: 'light'
        description: "'light' runs test only; 'full' additionally runs check, lint, and audit"
      rust-toolchain:
        required: false
        type: string
        default: 'stable'
        description: 'Rust toolchain'
      deny-checks:
        required: false
        type: string
        default: 'licenses bans advisories'
        description: 'cargo-deny check arguments'
      test-args:
        required: false
        type: string
        default: '--all-features'
        description: 'Additional cargo test arguments'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-lint:
    name: Check & Lint
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: "ci"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10

      - name: Format check
        run: cargo fmt --check
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Clippy
        run: cargo clippy -- -D warnings
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Check
        run: cargo check
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache Rust
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: "ci"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10

      - name: Test
        run: cargo test ${{ inputs.test-args }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

  audit:
    name: Audit
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny
        run: cargo deny check ${{ inputs.deny-checks }}
