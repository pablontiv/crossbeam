name: Self-Tag

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: self-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Auto-tag
    uses: ./.github/workflows/auto-tag.yml
    permissions:
      contents: write

  move-alias:
    name: Move major alias
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2

      - name: Move major alias to new tag
        env:
          NEW_TAG: ${{ needs.auto-tag.outputs.new_tag }}
        run: |
          MAJOR="${NEW_TAG%%.*}"
          git fetch origin tag "$NEW_TAG"
          git tag -f "$MAJOR" "$NEW_TAG"
          git push origin "$MAJOR" --force
