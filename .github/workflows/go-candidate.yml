name: Go PR Candidate

on:
  workflow_call:
    inputs:
      source-repository:
        description: 'Public fork repository containing the PR commit (owner/name)'
        required: true
        type: string
      source-sha:
        description: 'Exact 40-character PR commit SHA'
        required: true
        type: string
      base-sha:
        description: 'Exact 40-character caller base commit SHA'
        required: true
        type: string
      pr-number:
        description: 'Positive pull request number'
        required: true
        type: number
      binary-name:
        description: 'Binary expected in every archive'
        required: true
        type: string
      go-version:
        description: 'Exact trusted Go patch version, for example 1.24.1'
        required: true
        type: string
      goreleaser-config:
        description: 'GoReleaser config path read from the caller repository at base-sha'
        required: false
        type: string
        default: '.goreleaser.yml'
    outputs:
      artifact-id:
        description: 'Final validated artifact ID'
        value: ${{ jobs.publish.outputs.artifact-id }}
      artifact-digest:
        description: 'Final validated artifact digest'
        value: ${{ jobs.publish.outputs.artifact-digest }}
      artifact-name:
        description: 'Final validated artifact name'
        value: ${{ jobs.publish.outputs.artifact-name }}
      candidate-version:
        description: 'Validated candidate version'
        value: ${{ jobs.publish.outputs.candidate-version }}
      source-sha:
        description: 'Normalized candidate source SHA'
        value: ${{ jobs.publish.outputs.source-sha }}

permissions: {}

jobs:
  metadata:
    name: Validate trusted metadata
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      source-sha: ${{ steps.metadata.outputs.source_sha }}
      base-sha: ${{ steps.metadata.outputs.base_sha }}
      base-version: ${{ steps.metadata.outputs.base_version }}
      candidate-version: ${{ steps.metadata.outputs.candidate_version }}
      base-ref: ${{ steps.metadata.outputs.base_ref }}
    steps:
      - name: Validate PR and base graph
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_SHA_INPUT: ${{ inputs.source-sha }}
          BASE_SHA_INPUT: ${{ inputs.base-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BINARY_NAME: ${{ inputs.binary-name }}
          GO_VERSION: ${{ inputs.go-version }}
          GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          errors = []
          repository = os.environ["SOURCE_REPOSITORY"]
          repository_pattern = r"[A-Za-z0-9](?:[A-Za-z0-9_.-]*[A-Za-z0-9])?/[A-Za-z0-9](?:[A-Za-z0-9_.-]*[A-Za-z0-9])?"
          if not re.fullmatch(repository_pattern, repository) or ".." in repository:
              errors.append("source-repository must be an owner/name")
          for name in ("SOURCE_SHA_INPUT", "BASE_SHA_INPUT"):
              if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ[name]):
                  errors.append(f"{name.lower().replace('_input', '').replace('_', '-')} must be 40 hexadecimal characters")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["PR_NUMBER"]):
              errors.append("pr-number must be a positive integer")
          binary = os.environ["BINARY_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", binary) or binary.startswith("."):
              errors.append("binary-name must be a non-hidden basename")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["GO_VERSION"]):
              errors.append("go-version must be an exact patch version")
          config = os.environ["GORELEASER_CONFIG"]
          if (not re.fullmatch(r"[A-Za-z0-9._/-]+", config or "") or config.startswith(("/", "-"))
                  or any(part in ("", ".", "..") for part in config.split("/"))):
              errors.append("goreleaser-config must be a safe relative path")
          if errors:
              print("\n".join(f"::error::{error}" for error in errors))
              sys.exit(1)
          PY

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GitHub token is unavailable for PR validation"
            exit 1
          fi
          source_sha=${SOURCE_SHA_INPUT,,}
          base_sha=${BASE_SHA_INPUT,,}
          payload=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL%/}/repos/${CALLER_REPOSITORY}/pulls/${PR_NUMBER}")
          api_values=$(PR_PAYLOAD="$payload" python3 - "$SOURCE_REPOSITORY" "$source_sha" "$base_sha" <<'PY'
          import json
          import os
          import re
          import sys

          try:
              pull = json.loads(os.environ["PR_PAYLOAD"])
              head_repo = pull["head"]["repo"]["full_name"]
              head_sha = pull["head"]["sha"].lower()
              base_sha = pull["base"]["sha"].lower()
              base_ref = pull["base"]["ref"]
          except (AttributeError, KeyError, TypeError, json.JSONDecodeError) as error:
              raise SystemExit(f"::error::Invalid pull request API payload: {error}")
          if (head_repo, head_sha, base_sha) != tuple(sys.argv[1:4]):
              raise SystemExit("::error::Pull request head repository/SHA or base SHA does not match inputs")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", base_ref) or base_ref.startswith(("/", "-")) or ".." in base_ref:
              raise SystemExit("::error::Unsafe PR base ref")
          print(base_ref)
          PY
          )

          graph=$(mktemp -d)
          git -C "$graph" init
          git -C "$graph" remote add base "https://github.com/${CALLER_REPOSITORY}.git"
          git -C "$graph" fetch --no-tags base "+refs/heads/${api_values}:refs/remotes/base/pr-base"
          branch_tip=$(git -C "$graph" rev-parse refs/remotes/base/pr-base)
          if [[ "$branch_tip" != "$base_sha" ]]; then
            echo "::error::PR base SHA is no longer the base branch tip; regenerate the candidate"
            exit 1
          fi
          while read -r object ref; do
            [[ -n "$object" ]] || continue
            tag=${ref#refs/tags/}
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              git -C "$graph" fetch --no-tags base "$ref:$ref"
            fi
          done < <(git -C "$graph" ls-remote --tags --refs base 'refs/tags/v*')
          base_version=$(git -C "$graph" tag --merged "$base_sha" -l 'v*' | sort -V | tail -n 1)
          if [[ -z "$base_version" ]] || ! git -C "$graph" merge-base --is-ancestor "$base_version^{commit}" "$base_sha"; then
            echo "::error::No trusted stable base tag is an ancestor of base-sha"
            exit 1
          fi
          candidate_version=$(python3 - "$base_version" "$PR_NUMBER" "${source_sha:0:7}" <<'PY'
          import re
          import sys
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1])
          if not match:
              raise SystemExit("invalid base version")
          major, minor, patch = map(int, match.groups())
          print(f"{major}.{minor}.{patch + 1}-pr.{sys.argv[2]}.g{sys.argv[3]}")
          PY
          )
          {
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
            echo "base_version=$base_version"
            echo "candidate_version=$candidate_version"
            echo "base_ref=$api_values"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build untrusted raw candidate
    needs: metadata
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      raw-artifact-id: ${{ steps.raw.outputs.artifact-id }}
      raw-artifact-digest: ${{ steps.raw.outputs.artifact-digest }}
    steps:
      - name: Setup trusted Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
          token: ''

      - name: Verify local Go toolchain
        env:
          EXPECTED_GO_VERSION: ${{ inputs.go-version }}
          GOTOOLCHAIN: local
        run: |
          actual=$(go env GOVERSION)
          if [[ "$actual" != "go${EXPECTED_GO_VERSION}" ]]; then
            echo "::error::Go toolchain $actual does not equal go${EXPECTED_GO_VERSION}"
            exit 1
          fi

      - name: Install GoReleaser without running source
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v6.3.0
        with:
          distribution: goreleaser
          version: 'v2.18.2'
          install-only: true

      - name: Fetch exact public source and trusted config
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
          BASE_VERSION: ${{ needs.metadata.outputs.base-version }}
          GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
        run: |
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --no-tags origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

          git -C source remote add base "https://github.com/${BASE_REPOSITORY}.git"
          git -C source fetch --no-tags base "$BASE_SHA"
          git -C source fetch --no-tags base "refs/tags/${BASE_VERSION}:refs/tags/${BASE_VERSION}"
          if ! git -C source merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"; then
            echo "::error::base-sha must be an ancestor of source-sha; rebase and regenerate"
            exit 1
          fi
          if ! git -C source merge-base --is-ancestor "$BASE_VERSION^{commit}" "$BASE_SHA"; then
            echo "::error::trusted base version is not an ancestor of base-sha"
            exit 1
          fi

          mode=$(git -C source ls-tree "$BASE_SHA" -- "$GORELEASER_CONFIG" | awk 'NR == 1 {print $1}')
          if [[ "$mode" != "100644" && "$mode" != "100755" ]]; then
            echo "::error::GoReleaser config at base-sha must be a regular blob"
            exit 1
          fi
          trusted_config="$RUNNER_TEMP/trusted-goreleaser.yml"
          git -C source show "${BASE_SHA}:${GORELEASER_CONFIG}" > "$trusted_config"
          printf '%s\n' "$trusted_config" > "$RUNNER_TEMP/trusted-config-path"

      - name: Build candidate with sanitized environment
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          trusted_config=$(cat "$RUNNER_TEMP/trusted-config-path")
          cd source
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            TMPDIR="$RUNNER_TEMP" \
            GOTOOLCHAIN=local \
            PR_NUMBER="$PR_NUMBER" \
            goreleaser release --snapshot --clean --config "$trusted_config"

      - name: Bound and stage raw dist
        env:
          RAW_ROOT: ${{ runner.temp }}/candidate-raw
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import stat

          workspace = Path.cwd().resolve()
          dist = (workspace / "source/dist").resolve(strict=True)
          if dist.is_symlink() or not dist.is_dir():
              raise SystemExit("::error::dist must be a real directory")

          def safe_file(raw):
              if not isinstance(raw, str) or not raw or Path(raw).is_absolute() or "\\" in raw:
                  raise SystemExit("::error::unsafe dist path")
              path = workspace / "source" / raw
              try:
                  path.relative_to(dist)
              except ValueError:
                  raise SystemExit("::error::dist path escapes")
              if any(part in ("", ".", "..") or part.startswith(".") for part in Path(raw).parts):
                  raise SystemExit("::error::hidden or traversing dist path")
              if any(parent.is_symlink() for parent in [path, *path.parents] if parent != workspace.parent):
                  raise SystemExit("::error::dist path contains symlink")
              resolved = path.resolve(strict=True)
              resolved.relative_to(dist)
              if not stat.S_ISREG(resolved.stat(follow_symlinks=False).st_mode):
                  raise SystemExit("::error::dist path is not regular")
              return resolved

          artifacts_path = safe_file("dist/artifacts.json")
          metadata_path = safe_file("dist/metadata.json")
          document = json.loads(artifacts_path.read_text())
          artifacts = document.get("artifacts") if isinstance(document, dict) else document
          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("::error::invalid artifacts.json")
          selected = [item for item in artifacts if item.get("type") in ("Archive", "Checksum")]
          archives = [item for item in selected if item.get("type") == "Archive"]
          checksums = [item for item in selected if item.get("type") == "Checksum"]
          if not 1 <= len(archives) <= 32 or len(checksums) != 1:
              raise SystemExit("::error::raw artifact count is outside limits")
          files = [artifacts_path, metadata_path, *(safe_file(item.get("path")) for item in selected)]
          if len({path.name.casefold() for path in files}) != len(files):
              raise SystemExit("::error::raw basenames collide")
          total = sum(path.stat().st_size for path in files)
          if total > 1024 * 1024 * 1024 or any(path.stat().st_size > 256 * 1024 * 1024 for path in files):
              raise SystemExit("::error::raw artifact size limit exceeded")
          target = Path(os.environ["RAW_ROOT"])
          if target.exists():
              shutil.rmtree(target)
          target_dist = target / "dist"
          target_dist.mkdir(parents=True)
          for path in sorted(files, key=lambda item: item.name):
              shutil.copy2(path, target_dist / path.name)
          PY

      - name: Upload raw candidate dist
        id: raw
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: go-candidate-raw-pr-${{ inputs.pr-number }}-${{ needs.metadata.outputs.source-sha }}
          path: ${{ runner.temp }}/candidate-raw/
          compression-level: 0
          include-hidden-files: true
          retention-days: 1
          overwrite: false
          if-no-files-found: error

  static-validate:
    name: Validate raw candidate without execution
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Setup trusted Go inspector
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
          token: ''

      - name: Download exact raw artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.raw-artifact-id }}
          path: raw
          merge-multiple: true

      - name: Validate raw candidate statically
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate-version }}
          BINARY_NAME: ${{ inputs.binary-name }}
          GO_VERSION: ${{ inputs.go-version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import tarfile
          import tempfile
          import zipfile

          root = Path("raw").resolve()
          dist = root / "dist"
          if dist.is_symlink() or not dist.is_dir():
              raise SystemExit("::error::raw dist must be a real directory")
          MAX_ENTRIES = 128
          MAX_MEMBER = 256 * 1024 * 1024
          MAX_EXPANDED = 512 * 1024 * 1024
          MAX_RATIO = 200

          def regular(path):
              if path.is_symlink() or not path.is_file() or not stat.S_ISREG(path.stat(follow_symlinks=False).st_mode):
                  raise SystemExit(f"::error::not a regular raw file: {path}")
              return path

          artifacts_path = regular(dist / "artifacts.json")
          metadata_path = regular(dist / "metadata.json")
          document = json.loads(artifacts_path.read_text())
          artifacts = document.get("artifacts") if isinstance(document, dict) else document
          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("::error::invalid artifacts.json")
          archives = [item for item in artifacts if item.get("type") == "Archive"]
          checksum_items = [item for item in artifacts if item.get("type") == "Checksum"]
          if not 1 <= len(archives) <= 32 or len(checksum_items) != 1:
              raise SystemExit("::error::invalid archive/checksum inventory")

          def raw_path(item):
              raw = item.get("path")
              if not isinstance(raw, str) or Path(raw).is_absolute() or "\\" in raw:
                  raise SystemExit("::error::unsafe artifact path")
              parts = PurePosixPath(raw).parts
              if len(parts) != 2 or parts[0] != "dist" or any(part in ("", ".", "..") or part.startswith(".") for part in parts):
                  raise SystemExit("::error::artifact path must be dist/non-hidden-basename")
              return regular(root / Path(*parts))

          archive_paths = [(item, raw_path(item)) for item in archives]
          checksum_path = raw_path(checksum_items[0])
          expected_files = {"artifacts.json", "metadata.json", checksum_path.name, *(path.name for _, path in archive_paths)}
          actual_files = {path.name for path in dist.iterdir() if path.is_file() and not path.is_symlink()}
          if actual_files != expected_files or len(list(dist.iterdir())) != len(expected_files):
              raise SystemExit("::error::raw dist inventory does not exactly match declarations")
          if len({name.casefold() for name in expected_files}) != len(expected_files):
              raise SystemExit("::error::raw filename casefold collision")

          checksums = {}
          for line in checksum_path.read_text().splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
              if not match or match.group(2).startswith(".") or match.group(2) in checksums:
                  raise SystemExit("::error::invalid or duplicate checksum")
              checksums[match.group(2)] = match.group(1).lower()
          archive_names = {path.name for _, path in archive_paths}
          if set(checksums) != archive_names:
              raise SystemExit("::error::checksums do not map one-to-one to archives")

          metadata = json.loads(metadata_path.read_text())
          if metadata.get("version") != os.environ["CANDIDATE_VERSION"] or "dev" in metadata.get("version", "").lower():
              raise SystemExit("::error::candidate metadata version mismatch")
          if str(metadata.get("commit", "")).lower() != os.environ["SOURCE_SHA"]:
              raise SystemExit("::error::candidate metadata commit mismatch")

          def safe_member_name(name):
              if not name or name.startswith("/") or "\\" in name or any(ord(char) < 32 or ord(char) > 126 for char in name):
                  raise SystemExit("::error::archive member path must be relative printable ASCII")
              parts = PurePosixPath(name).parts
              if any(part in ("", ".", "..") or part.startswith(".")
                     or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", part) for part in parts):
                  raise SystemExit("::error::archive member is hidden, traversing, or unsafe")
              return parts

          matrix = set()
          for item, archive in sorted(archive_paths, key=lambda pair: pair[1].name):
              if hashlib.sha256(archive.read_bytes()).hexdigest() != checksums[archive.name]:
                  raise SystemExit("::error::archive checksum mismatch")
              platform = (item.get("goos"), item.get("goarch"))
              if not all(isinstance(value, str) and re.fullmatch(r"[a-z0-9]+", value) for value in platform) or platform in matrix:
                  raise SystemExit("::error::invalid or duplicate platform matrix entry")
              matrix.add(platform)
              members = []
              expanded = 0
              if zipfile.is_zipfile(archive):
                  with zipfile.ZipFile(archive) as bundle:
                      for info in bundle.infolist():
                          mode = info.external_attr >> 16
                          if info.is_dir() or (mode and not stat.S_ISREG(mode)) or info.flag_bits & 1:
                              raise SystemExit("::error::zip contains non-regular or encrypted member")
                          members.append((info.filename, info.file_size, info.compress_size, lambda value=info: bundle.read(value)))
                      member_data = [(name, size, compressed, reader()) for name, size, compressed, reader in members]
              elif tarfile.is_tarfile(archive):
                  with tarfile.open(archive, "r:*") as bundle:
                      for member in bundle.getmembers():
                          if not member.isfile():
                              raise SystemExit("::error::tar contains link, directory, device, or other non-regular member")
                          extracted = bundle.extractfile(member)
                          if extracted is None:
                              raise SystemExit("::error::tar member cannot be read")
                          members.append((member.name, member.size, archive.stat().st_size, extracted.read()))
                      member_data = members
              else:
                  raise SystemExit("::error::unsupported archive format")
              if not 1 <= len(member_data) <= MAX_ENTRIES:
                  raise SystemExit("::error::archive entry limit exceeded")
              seen = set()
              binaries = []
              for name, size, compressed, data in member_data:
                  parts = safe_member_name(name)
                  folded = name.casefold()
                  if folded in seen:
                      raise SystemExit("::error::duplicate or casefold-colliding archive member")
                  seen.add(folded)
                  if size != len(data) or size > MAX_MEMBER:
                      raise SystemExit("::error::archive member size limit exceeded")
                  expanded += size
                  if (size and compressed <= 0) or (compressed > 0 and size > compressed * MAX_RATIO):
                      raise SystemExit("::error::archive compression ratio limit exceeded")
                  if parts[-1] == os.environ["BINARY_NAME"]:
                      binaries.append(data)
              if expanded > MAX_EXPANDED or expanded > max(archive.stat().st_size, 1) * MAX_RATIO:
                  raise SystemExit("::error::archive expanded size limit exceeded")
              if len(binaries) != 1:
                  raise SystemExit("::error::archive must contain binary-name exactly once")
              with tempfile.NamedTemporaryFile() as binary:
                  binary.write(binaries[0])
                  binary.flush()
                  result = subprocess.run(["go", "version", "-m", binary.name], check=True, text=True, capture_output=True)
              if f"go{os.environ['GO_VERSION']}" not in result.stdout:
                  raise SystemExit("::error::binary Go toolchain mismatch")
              revisions = re.findall(r"(?m)^\s*build\s+vcs\.revision=(\S+)\s*$", result.stdout)
              if revisions != [os.environ["SOURCE_SHA"]]:
                  raise SystemExit("::error::binary revision mismatch")
          if ("linux", "amd64") not in matrix:
              raise SystemExit("::error::platform matrix lacks linux/amd64")
          PY

  smoke:
    name: Isolated linux amd64 smoke
    needs: [metadata, build, static-validate]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Download exact raw artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.raw-artifact-id }}
          path: raw
          merge-multiple: true

      - name: Extract only validated smoke binary
        id: extract
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import tarfile
          import tempfile
          import zipfile

          root = Path("raw").resolve()
          dist = root / "dist"
          if dist.is_symlink() or not dist.is_dir():
              raise SystemExit("::error::raw dist must be a real directory")
          artifacts = json.loads((dist / "artifacts.json").read_text())
          artifacts = artifacts.get("artifacts") if isinstance(artifacts, dict) else artifacts
          matches = [item for item in artifacts if item.get("type") == "Archive" and item.get("goos") == "linux" and item.get("goarch") == "amd64"]
          if len(matches) != 1:
              raise SystemExit("::error::expected one linux/amd64 archive")
          raw = matches[0].get("path")
          parts = PurePosixPath(raw).parts
          if len(parts) != 2 or parts[0] != "dist" or any(part in ("", ".", "..") or part.startswith(".") for part in parts):
              raise SystemExit("::error::unsafe smoke archive path")
          archive = root / Path(*parts)
          payloads = []
          if zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive) as bundle:
                  for info in bundle.infolist():
                      mode = info.external_attr >> 16
                      if PurePosixPath(info.filename).name == os.environ["BINARY_NAME"] and not info.is_dir() and (not mode or stat.S_ISREG(mode)):
                          payloads.append(bundle.read(info))
          elif tarfile.is_tarfile(archive):
              with tarfile.open(archive, "r:*") as bundle:
                  for member in bundle.getmembers():
                      if PurePosixPath(member.name).name == os.environ["BINARY_NAME"] and member.isfile():
                          stream = bundle.extractfile(member)
                          if stream is not None:
                              payloads.append(stream.read())
          if len(payloads) != 1:
              raise SystemExit("::error::smoke binary is absent or ambiguous")
          sandbox = Path(tempfile.mkdtemp(prefix="candidate-smoke-"))
          binary = sandbox / "candidate"
          binary.write_bytes(payloads[0])
          binary.chmod(0o500)
          for name in ("home", "tmp", "config", "cache", "data", "state", "db"):
              (sandbox / name).mkdir()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"sandbox={sandbox}", file=output)
              print(f"binary={binary}", file=output)
          PY

      - name: Execute candidate in empty environment
        env:
          SANDBOX: ${{ steps.extract.outputs.sandbox }}
          SMOKE_BINARY: ${{ steps.extract.outputs.binary }}
          CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate-version }}
        run: |
          version_output=$(timeout 30s env -i \
            HOME="$SANDBOX/home" \
            TMPDIR="$SANDBOX/tmp" \
            XDG_CONFIG_HOME="$SANDBOX/config" \
            XDG_CACHE_HOME="$SANDBOX/cache" \
            XDG_DATA_HOME="$SANDBOX/data" \
            XDG_STATE_HOME="$SANDBOX/state" \
            DATABASE_URL="sqlite:///$SANDBOX/db/candidate.db" \
            "$SMOKE_BINARY" --version 2>&1)
          if [[ "$version_output" != *"$CANDIDATE_VERSION"* ]] || [[ "${version_output,,}" == *dev* ]]; then
            echo "::error::isolated --version output is not the candidate version"
            exit 1
          fi

  publish:
    name: Publish validated candidate
    needs: [metadata, build, static-validate, smoke]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      artifact-id: ${{ steps.final.outputs.artifact-id }}
      artifact-digest: ${{ steps.final.outputs.artifact-digest }}
      artifact-name: ${{ steps.manifest.outputs.artifact_name }}
      candidate-version: ${{ needs.metadata.outputs.candidate-version }}
      source-sha: ${{ needs.metadata.outputs.source-sha }}
    steps:
      - name: Download exact raw artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.raw-artifact-id }}
          path: raw
          merge-multiple: true

      - name: Revalidate inventory and create manifest
        id: manifest
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
          BASE_VERSION: ${{ needs.metadata.outputs.base-version }}
          CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate-version }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat

          root = Path("raw").resolve()
          dist = root / "dist"
          if dist.is_symlink() or not dist.is_dir():
              raise SystemExit("::error::raw dist must be a real directory")

          def regular(path):
              if path.is_symlink() or not path.is_file() or not stat.S_ISREG(path.stat(follow_symlinks=False).st_mode):
                  raise SystemExit("::error::publish input is not regular")
              return path

          document = json.loads(regular(dist / "artifacts.json").read_text())
          artifacts = document.get("artifacts") if isinstance(document, dict) else document
          if not isinstance(artifacts, list) or not all(isinstance(item, dict) for item in artifacts):
              raise SystemExit("::error::invalid artifacts.json")
          archives = [item for item in artifacts if item.get("type") == "Archive"]
          checksum_items = [item for item in artifacts if item.get("type") == "Checksum"]
          if not archives or len(checksum_items) != 1:
              raise SystemExit("::error::invalid publish inventory")

          def declared_path(item):
              raw = item.get("path")
              parts = PurePosixPath(raw).parts if isinstance(raw, str) else ()
              if len(parts) != 2 or parts[0] != "dist" or any(part in ("", ".", "..") or part.startswith(".") for part in parts):
                  raise SystemExit("::error::unsafe publish path")
              return regular(root / Path(*parts))

          archive_paths = [(item, declared_path(item)) for item in archives]
          checksum_path = declared_path(checksum_items[0])
          expected = {"artifacts.json", "metadata.json", checksum_path.name, *(path.name for _, path in archive_paths)}
          actual = {path.name for path in dist.iterdir() if path.is_file() and not path.is_symlink()}
          if actual != expected or len(list(dist.iterdir())) != len(expected) or len({name.casefold() for name in expected}) != len(expected):
              raise SystemExit("::error::publish inventory mismatch")
          checksums = {}
          for line in checksum_path.read_text().splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
              if not match or match.group(2) in checksums:
                  raise SystemExit("::error::invalid publish checksum")
              checksums[match.group(2)] = match.group(1).lower()
          if set(checksums) != {path.name for _, path in archive_paths}:
              raise SystemExit("::error::publish checksums are not one-to-one")
          metadata = json.loads(regular(dist / "metadata.json").read_text())
          if metadata.get("version") != os.environ["CANDIDATE_VERSION"] or str(metadata.get("commit", "")).lower() != os.environ["SOURCE_SHA"]:
              raise SystemExit("::error::publish metadata mismatch")

          manifest_archives = []
          for item, path in sorted(archive_paths, key=lambda pair: pair[1].name):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if checksums.get(path.name) != digest:
                  raise SystemExit("::error::publish archive checksum mismatch")
              manifest_archives.append({
                  "file": path.name,
                  "goarch": item.get("goarch"),
                  "goos": item.get("goos"),
                  "name": item.get("name", path.name),
                  "sha256": digest,
              })
          stage = Path("candidate-upload")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()
          for _, path in sorted(archive_paths, key=lambda pair: pair[1].name):
              shutil.copy2(path, stage / path.name)
          shutil.copy2(checksum_path, stage / checksum_path.name)
          manifest = {
              "archives": manifest_archives,
              "base": os.environ["BASE_SHA"],
              "base_version": os.environ["BASE_VERSION"],
              "candidate_version": os.environ["CANDIDATE_VERSION"],
              "pr": int(os.environ["PR_NUMBER"]),
              "schema": 1,
              "sha": os.environ["SOURCE_SHA"],
          }
          (stage / "candidate.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          expected_stage = {path.name for _, path in archive_paths} | {checksum_path.name, "candidate.json"}
          if {path.name for path in stage.iterdir()} != expected_stage or any(path.is_symlink() or not path.is_file() for path in stage.iterdir()):
              raise SystemExit("::error::final stage allowlist mismatch")
          artifact_name = f"go-candidate-pr-{os.environ['PR_NUMBER']}-{os.environ['SOURCE_SHA']}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"artifact_name={artifact_name}", file=output)
          PY

      - name: Upload final validated candidate
        id: final
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: candidate-upload/
          compression-level: 0
          include-hidden-files: false
          retention-days: 7
          overwrite: false
          if-no-files-found: error
